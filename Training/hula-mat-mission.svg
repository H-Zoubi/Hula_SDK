<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/>
    </marker>
    <style>
      .lbl { fill: #ffffff; font-size: 19px; font-weight: 600; }
      .sub { fill: #dfe4ee; font-size: 15px; }
      .num { fill: #3b4357; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .pad { fill: #e9ecf2; stroke: #ffffff; stroke-width: 3; stroke-dasharray: 6 4; }
      .padblue { fill: #7cc4e6; stroke: #ffffff; stroke-width: 3; stroke-dasharray: 6 4; }
      .link { stroke: #ffffff; stroke-width: 2.5; stroke-dasharray: 8 6; fill: none; }
      .path { stroke: #ffffff; stroke-width: 14; stroke-dasharray: 26 22; fill: none; stroke-linecap: butt; opacity: 0.22; }
      .legend { fill: #1f2430; font-size: 18px; }
      .legend-h { fill: #1f2430; font-size: 22px; font-weight: 700; }
      .legend-cn { fill: #6b7385; font-size: 15px; }
      .leg { fill: none; stroke-width: 9; stroke-linecap: round; }
      .halo { fill: none; stroke: #ffffff; stroke-width: 17; stroke-linecap: round; opacity: 0.9; }
      .pill-t { fill: #ffffff; font-size: 21px; font-weight: 700; dominant-baseline: central; }
      .step-n { fill: #ffffff; font-size: 24px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .step { fill: #1f2430; font-size: 27px; dominant-baseline: central; }
      .step b { font-weight: 700; }
    </style>
    <marker id="ah-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e5484d"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e5f"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a7bf0"/></marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9b4fd6"/></marker>
  </defs>

  <rect width="1920" height="1080" fill="#ffffff"/>

  <!-- Mat on the left (original route faded), mission steps on the right -->
  <g transform="translate(40,-10)">
  
    <!-- Mat -->
    <rect x="40" y="90" width="920" height="920" fill="#7d869c"/>
    <rect x="58" y="108" width="884" height="884" fill="#56607a"/>
    <polygon points="58,108 170,108 58,220" fill="#8b94a8"/>
    <polygon points="942,992 830,992 942,880" fill="#8b94a8"/>
  
    <!-- Flight route: out from H to the right, around the course clockwise, back into H from above -->
    <path class="path" d="M 250 862 L 352 846 C 440 832 520 790 574 748 C 640 700 720 660 720 600 L 721 513 C 722 440 700 380 629 274 C 590 220 480 240 380 240 C 300 240 230 260 190 330 C 150 400 140 520 150 620 C 156 690 166 740 168 778"/>
  
    <!-- Takeoff / landing point -->
    <circle cx="168" cy="862" r="76" fill="#e9ecf2"/>
    <circle cx="168" cy="862" r="52" fill="#ffffff" stroke="#2457c5" stroke-width="10"/>
    <text x="168" y="864" font-size="50" font-weight="800" fill="#2457c5" text-anchor="middle" dominant-baseline="central">H</text>
    <text class="lbl" x="168" y="968" text-anchor="middle">Takeoff / Landing</text>
  
    <!-- Ring 1 -->
    <line class="link" x1="348" y1="777" x2="348" y2="912"/>
    <line class="link" x1="358" y1="777" x2="358" y2="912"/>
    <rect class="pad" x="328" y="727" width="50" height="50"/>
    <rect class="pad" x="328" y="912" width="50" height="50"/>
  
    <!-- Ring 2 (diagonal) -->
    <line class="link" x1="540" y1="700" x2="608" y2="796"/>
    <line class="link" x1="549" y1="694" x2="617" y2="790"/>
    <rect class="pad" x="502" y="654" width="50" height="50" transform="rotate(-12 527 679)"/>
    <rect class="pad" x="595" y="792" width="50" height="50" transform="rotate(-12 620 817)"/>
  
    <!-- Ring 3 -->
    <line class="link" x1="672" y1="508" x2="770" y2="508"/>
    <line class="link" x1="672" y1="518" x2="770" y2="518"/>
    <rect class="pad" x="622" y="488" width="50" height="50"/>
    <rect class="pad" x="770" y="488" width="50" height="50"/>
  
    <!-- Vertical ring (blue pads) -->
    <line class="link" x1="599" y1="269" x2="659" y2="269"/>
    <line class="link" x1="599" y1="279" x2="659" y2="279"/>
    <rect class="padblue" x="549" y="249" width="50" height="50"/>
    <rect class="padblue" x="659" y="249" width="50" height="50"/>
  
    <!-- Advanced targets -->
    <circle cx="470" cy="930" r="36" fill="#f1f3f7"/><text class="num" x="470" y="931">1</text>
  
    <circle cx="800" cy="715" r="36" fill="#f1f3f7"/><text class="num" x="800" y="716">2</text>
  
    <circle cx="290" cy="490" r="36" fill="#f1f3f7"/><text class="num" x="290" y="491">4</text>
  
    <!-- Beginner target -->
    <circle cx="290" cy="165" r="28" fill="#f1f3f7"/><text class="num" x="290" y="166" font-size="24">3</text>
  
    <!-- Blue markers on the return leg -->
    <ellipse cx="220" cy="300" rx="26" ry="20" fill="#7cc4e6" stroke="#ffffff" stroke-width="5"/>
    <ellipse cx="150" cy="640" rx="26" ry="20" fill="#7cc4e6" stroke="#ffffff" stroke-width="5"/>
  

    <!-- Mission legs: line colour = light colour on that leg -->
    <line class="halo" x1="246" y1="880" x2="415" y2="918"/>
    <line class="leg" x1="246" y1="880" x2="415" y2="918" stroke="#e5484d" marker-end="url(#ah-red)"/>
    <line class="halo" x1="510" y1="904" x2="752" y2="746"/>
    <line class="leg" x1="510" y1="904" x2="752" y2="746" stroke="#2f9e5f" marker-end="url(#ah-green)"/>
    <line class="halo" x1="767" y1="680" x2="323" y2="201"/>
    <line class="leg" x1="767" y1="680" x2="323" y2="201" stroke="#3a7bf0" marker-end="url(#ah-blue)"/>
    <line class="halo" x1="290" y1="205" x2="290" y2="438"/>
    <line class="leg" x1="290" y1="205" x2="290" y2="438" stroke="#9b4fd6" marker-end="url(#ah-purple)"/>
    <line class="halo" x1="276" y1="534" x2="197" y2="774"/>
    <line class="leg" x1="276" y1="534" x2="197" y2="774" stroke="#9b4fd6" marker-end="url(#ah-purple)"/>

    <!-- What happens at each stop -->
    <rect x="262" y="794" width="128" height="40" rx="20" fill="#e5484d"/>
    <text class="pill-t" x="280" y="814">Start: red</text>
    <rect x="520" y="948" width="214" height="40" rx="20" fill="#2f9e5f"/>
    <text class="pill-t" x="538" y="968">Green · up 20 cm</text>
    <rect x="712" y="782" width="226" height="40" rx="20" fill="#3a7bf0"/>
    <text class="pill-t" x="730" y="802">Blue · down 5 cm</text>
    <rect x="332" y="145" width="100" height="40" rx="20" fill="#9b4fd6"/>
    <text class="pill-t" x="350" y="165">Purple</text>
    <rect x="340" y="470" width="150" height="40" rx="20" fill="#9b4fd6"/>
    <text class="pill-t" x="358" y="490">Bounce ×2</text>
  </g>

  <text x="1100" y="150" font-size="52" font-weight="700" fill="#1f2430">Mat Mission</text>
  <text x="1100" y="198" font-size="26" fill="#6b7385">Line colour = the drone's light on that leg</text>

  <circle cx="1124" cy="290" r="22" fill="#e5484d"/><text class="step-n" x="1124" y="291">1</text>
  <text class="step" x="1166" y="290"><tspan font-weight="700">Take off</tspan> at H, light <tspan font-weight="700">red</tspan>, fly to 1</text>

  <circle cx="1124" cy="380" r="22" fill="#2f9e5f"/><text class="step-n" x="1124" y="381">2</text>
  <text class="step" x="1166" y="380">At 1: light <tspan font-weight="700">green</tspan>, fly <tspan font-weight="700">up 20 cm</tspan>, fly to 2</text>

  <circle cx="1124" cy="470" r="22" fill="#3a7bf0"/><text class="step-n" x="1124" y="471">3</text>
  <text class="step" x="1166" y="470">At 2: light <tspan font-weight="700">blue</tspan>, fly <tspan font-weight="700">down 5 cm</tspan>, fly to 3</text>

  <circle cx="1124" cy="560" r="22" fill="#9b4fd6"/><text class="step-n" x="1124" y="561">4</text>
  <text class="step" x="1166" y="560">At 3: light <tspan font-weight="700">purple</tspan>, fly to 4</text>

  <circle cx="1124" cy="650" r="22" fill="#9b4fd6"/><text class="step-n" x="1124" y="651">5</text>
  <text class="step" x="1166" y="650">At 4: <tspan font-weight="700">bounce 2 times</tspan>, fly to H</text>

  <circle cx="1124" cy="740" r="22" fill="#1f2430"/><text class="step-n" x="1124" y="741">6</text>
  <text class="step" x="1166" y="740"><tspan font-weight="700">Land</tspan> on H</text>

  <text x="1100" y="880" font-size="24" fill="#1f2430" font-weight="700">Before you fly</text>
  <text x="1100" y="920" font-size="23" fill="#4a5163">Measure each leg with a tape measure and work out each turn angle.</text>
  <text x="1100" y="954" font-size="23" fill="#4a5163">Write the blocks for every leg on your sheet, then get it signed.</text>
</svg>
