<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/>
    </marker>
    <style>
      .lbl { fill: #ffffff; font-size: 19px; font-weight: 600; }
      .sub { fill: #dfe4ee; font-size: 15px; }
      .num { fill: #3b4357; font-size: 30px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .pad { fill: #e9ecf2; stroke: #ffffff; stroke-width: 3; stroke-dasharray: 6 4; }
      .padblue { fill: #7cc4e6; stroke: #ffffff; stroke-width: 3; stroke-dasharray: 6 4; }
      .link { stroke: #ffffff; stroke-width: 2.5; stroke-dasharray: 8 6; fill: none; }
      .path { stroke: #ffffff; stroke-width: 14; stroke-dasharray: 26 22; fill: none; stroke-linecap: butt; opacity: 0.92; }
      .legend { fill: #1f2430; font-size: 26px; }
      .legend-h { fill: #1f2430; font-size: 30px; font-weight: 700; }
      .legend-cn { fill: #6b7385; font-size: 22px; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#ffffff"/>

  <!-- Mat on the left, title and key on the right -->
  <g transform="translate(40,-10)">
  
    <!-- Mat -->
    <rect x="40" y="90" width="920" height="920" fill="#7d869c"/>
    <rect x="58" y="108" width="884" height="884" fill="#56607a"/>
    <polygon points="58,108 170,108 58,220" fill="#8b94a8"/>
    <polygon points="942,992 830,992 942,880" fill="#8b94a8"/>
  
    <!-- Flight route: out from H to the right, around the course clockwise, back into H from above -->
    <path class="path" d="M 250 862 L 352 846 C 440 832 520 790 574 748 C 640 700 720 660 720 600 L 721 513 C 722 440 700 380 629 274 C 590 220 480 240 380 240 C 300 240 230 260 190 330 C 150 400 140 520 150 620 C 156 690 166 740 168 778"/>
    <line x1="268" y1="862" x2="300" y2="857" stroke="#ffffff" stroke-width="5" marker-end="url(#arrow)"/>
    <line x1="168" y1="742" x2="168" y2="780" stroke="#ffffff" stroke-width="5" marker-end="url(#arrow)"/>
  
    <!-- Takeoff / landing point -->
    <circle cx="168" cy="862" r="76" fill="#e9ecf2"/>
    <circle cx="168" cy="862" r="52" fill="#ffffff" stroke="#2457c5" stroke-width="10"/>
    <text x="168" y="864" font-size="50" font-weight="800" fill="#2457c5" text-anchor="middle" dominant-baseline="central">H</text>
    <text class="lbl" x="168" y="968" text-anchor="middle">Takeoff / Landing</text>
  
    <!-- Ring 1 -->
    <line class="link" x1="348" y1="777" x2="348" y2="912"/>
    <line class="link" x1="358" y1="777" x2="358" y2="912"/>
    <rect class="pad" x="328" y="727" width="50" height="50"/>
    <rect class="pad" x="328" y="912" width="50" height="50"/>
    <text class="lbl" x="353" y="715" text-anchor="middle">Ring 1</text>
  
    <!-- Ring 2 (diagonal) -->
    <line class="link" x1="540" y1="700" x2="608" y2="796"/>
    <line class="link" x1="549" y1="694" x2="617" y2="790"/>
    <rect class="pad" x="502" y="654" width="50" height="50" transform="rotate(-12 527 679)"/>
    <rect class="pad" x="595" y="792" width="50" height="50" transform="rotate(-12 620 817)"/>
    <text class="lbl" x="660" y="840">Ring 2</text>
  
    <!-- Ring 3 -->
    <line class="link" x1="672" y1="508" x2="770" y2="508"/>
    <line class="link" x1="672" y1="518" x2="770" y2="518"/>
    <rect class="pad" x="622" y="488" width="50" height="50"/>
    <rect class="pad" x="770" y="488" width="50" height="50"/>
    <text class="lbl" x="832" y="520">Ring 3</text>
  
    <!-- Vertical ring (blue pads) -->
    <line class="link" x1="599" y1="269" x2="659" y2="269"/>
    <line class="link" x1="599" y1="279" x2="659" y2="279"/>
    <rect class="padblue" x="549" y="249" width="50" height="50"/>
    <rect class="padblue" x="659" y="249" width="50" height="50"/>
    <text class="lbl" x="722" y="268">Vertical ring</text>
  
    <!-- Advanced targets -->
    <circle cx="470" cy="930" r="36" fill="#f1f3f7"/><text class="num" x="470" y="931">1</text>
  
    <circle cx="800" cy="715" r="36" fill="#f1f3f7"/><text class="num" x="800" y="716">2</text>
    <text class="lbl" x="800" y="774" text-anchor="middle">Advanced target 2</text>
  
    <circle cx="290" cy="490" r="36" fill="#f1f3f7"/><text class="num" x="290" y="491">4</text>
  
    <!-- Beginner target -->
    <circle cx="290" cy="165" r="28" fill="#f1f3f7"/><text class="num" x="290" y="166" font-size="24">3</text>
  
    <!-- Blue markers on the return leg -->
    <ellipse cx="220" cy="300" rx="26" ry="20" fill="#7cc4e6" stroke="#ffffff" stroke-width="5"/>
    <ellipse cx="150" cy="640" rx="26" ry="20" fill="#7cc4e6" stroke="#ffffff" stroke-width="5"/>
  
  </g>

  <text x="1100" y="160" font-size="52" font-weight="700" fill="#1f2430">HuLa Flight Mat</text>
  <text x="1100" y="208" font-size="26" fill="#6b7385">Top view</text>

  <text class="legend-h" x="1100" y="320">Key</text>
  <circle cx="1124" cy="380" r="20" fill="#ffffff" stroke="#2457c5" stroke-width="5"/>
  <text class="legend" x="1170" y="389">Takeoff / landing point <tspan class="legend-cn">起降点</tspan></text>
  <rect x="1104" y="440" width="40" height="40" fill="#e9ecf2" stroke="#56607a" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="legend" x="1170" y="469">Ring stand spots, linked pair <tspan class="legend-cn">1/2/3号圆环</tspan></text>
  <rect x="1104" y="520" width="40" height="40" fill="#7cc4e6" stroke="#56607a" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="legend" x="1170" y="549">Vertical ring stand spots <tspan class="legend-cn">竖直圆环</tspan></text>
  <circle cx="1124" cy="620" r="22" fill="#e9ecf2" stroke="#56607a" stroke-width="2"/>
  <text class="legend" x="1170" y="629">Advanced target <tspan class="legend-cn">高阶目标靶</tspan></text>
  <circle cx="1124" cy="700" r="16" fill="#e9ecf2" stroke="#56607a" stroke-width="2"/>
  <text class="legend" x="1170" y="709">Beginner target <tspan class="legend-cn">初阶目标靶</tspan></text>
  <ellipse cx="1124" cy="780" rx="20" ry="15" fill="#7cc4e6" stroke="#56607a" stroke-width="2"/>
  <text class="legend" x="1170" y="789">Blue marker (purpose not labelled)</text>

  <text x="1100" y="990" font-size="22" fill="#6b7385">Redrawn from photos. Positions are approximate and not to scale.</text>
</svg>
