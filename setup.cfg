[metadata]
name = hula-sdk
version = 0.1.0
description = A working Python SDK for the HighGreat HULA educational drone -- wraps pyhula and fixes two undocumented Windows connection bugs in the vendor SDK.
long_description = file: README.md
long_description_content_type = text/markdown
author = Hamza Abdelal
author_email = hamza.q.abdelal@gmail.com
keywords = hula, drone, pyhula, highgreat, hg-fly, robotics, education
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Education
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.6
    Operating System :: Microsoft :: Windows
    Topic :: System :: Hardware

[options]
packages = find:
python_requires = >=3.6
install_requires =
    pyhula

[options.packages.find]
include = hula_sdk*
